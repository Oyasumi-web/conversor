<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Conversor</title>
</head>

<body>
    <img id="coin_flip" src="./assets/coin_flip.gif">

    <main>
        <label class="top_container">
            Converter<b>de:</b>
            <select>
                <option value="real">R$ Real Brasileiro</option>
            </select>
        </label>
        <label class="top_container">
            Converter <b>para:</b>
            <select class="currency-selection">
                <option value="dolar">$ Dólar Americano</option>
                <option value="euro">€ Euro</option>
                <option value="iene">¥ Iene</option>
                <option value="bitcoin">₿ Bitcoin</option>
            </select>
        </label>

        <label class="top_container">
            Valor:
            <input class="input-currency" placeholder="R$ 10.000">
        </label>

        <section>
            <div class="currency-box">
                <img class="flag" src="./assets/brazil.png">
                <p class="currency">Real</p>
                <p class="currency-value-to-convert">R$ 1.000,00</p>
            </div>
            <img class="arrow" src="./assets/arrow.png">

            <div class="currency-box">
                <img class="flag currency-img" src="./assets/usa.png">
                <p class="currency" id="currency-name">Dólar</p>
                <p class="currency-value">US$ 3.000,00</p>
            </div>
        </section>

        <button class="convert-btn">Converter</button>
    </main>

    <script src="./main.js"></script>
</body>

</html>
